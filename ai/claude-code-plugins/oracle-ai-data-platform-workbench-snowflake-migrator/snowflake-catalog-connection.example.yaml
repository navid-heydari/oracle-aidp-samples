# Connection config for registering an EXTERNAL/SNOWFLAKE catalog in AIDP.
#
# Copy to `snowflake-catalog-connection.yaml` (gitignored) and fill in your own
# coordinates, then pass it explicitly:
#
#   python3 engine/snowmig.py catalog --out-dir ./snowmig_out \
#     --catalog <name> --connection-config ./snowflake-catalog-connection.yaml \
#     --execute --datalake-ocid <ocid> --workspace <ws> --cluster-id <cl>
#
# NO SECRET VALUE BELONGS IN THIS FILE. The credential is always a PATH to a
# separate file, read at call time, so a config that gets committed or pasted
# into a ticket cannot leak one.
#
# JSON works too -- the loader picks the parser from the file extension, and
# JSON needs no PyYAML.

account: MYORG-MYACCOUNT        # Snowflake account identifier
warehouse: MIGRATE_WH           # warehouse AIDP queries through
database: SALES_DB              # the Snowflake database this catalog points at
# schema: PUBLIC                # optional: default schema
# role: AIDP_READER             # optional: role to connect as
user: AIDP_SVC

# One of: keypair (preferred) | password | pat
auth: keypair
key_path: ~/.snowflake/aidp_rsa_key.p8
# key_passphrase_path: ~/.snowflake/aidp_rsa_key.passphrase
# password_path: ~/.snowflake/aidp.password
# pat_path: ~/.snowflake/aidp.pat
